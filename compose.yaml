# Please refer https://aka.ms/HTTPSinContainer on how to setup an https developer certificate for your ASP.NET Core service.
services:
  catalogserviceapi:
    image: catalogserviceapi
    build:
      context: .
      dockerfile: src/CatalogService/Catalog.Service.Api/Dockerfile
    ports:
      - "6000:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__CatalogDb=Host=catalogdb;Port=5432;Database=catalogdb;Username=postgres;Password=devpassword;
      - RabbitMQ__Host=rabbitmq
      - Jwt__PublicKey=${JWT_PUBLIC_KEY}
      - Jwt__Issuer=OrderFlow.Identity
      - Jwt__Audience=OrderFlow.Services
    depends_on:
      catalogdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  catalogdb:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=catalogdb
    ports:
      - "5432:5432"
    volumes:
      - catalogdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  orderingserviceapi:
    image: orderingserviceapi
    build:
      context: .
      dockerfile: src/OrderingService/Ordering.Service.Api/Dockerfile
    ports:
      - "6001:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__OrderingDb=Host=orderingdb;Port=5432;Database=orderingdb;Username=postgres;Password=devpassword;
      - RabbitMQ__Host=rabbitmq
      - Jwt__PublicKey=${JWT_PUBLIC_KEY}
      - Jwt__Issuer=OrderFlow.Identity
      - Jwt__Audience=OrderFlow.Services
    depends_on:
      orderingdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  orderingdb:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=orderingdb
    ports:
      - "5433:5432"
    volumes:
      - orderingdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  
  billingserviceapi:
    image: billingserviceapi
    build:
      context: .
      dockerfile: src/BillingService/Billing.Service.Api/Dockerfile
    ports:
      - "6002:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__BillingDb=Host=billingdb;Port=5432;Database=billingdb;Username=postgres;Password=devpassword;
      - RabbitMQ__Host=rabbitmq
    depends_on:
      billingdb:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  billingdb:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=billingdb
    ports:
      - "5434:5432"
    volumes:
      - billingdb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5

  identityserviceapi:
    image: identityserviceapi
    build:
      context: .
      dockerfile: src/IdentityService/Identity.Service.Api/Dockerfile
    ports:
      - "6004:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - ConnectionStrings__IdentityDb=Host=identitydb;Port=5432;Database=identitydb;Username=postgres;Password=devpassword;
      - Jwt__PrivateKey=${JWT_PRIVATE_KEY}
      - Jwt__Issuer=OrderFlow.Identity
      - Jwt__Audience=OrderFlow.Services
      - Jwt__ExpiryMinutes=60
      - Seed__AdminPassword=${ADMIN_SEED_PASSWORD}
    depends_on:
      identitydb:
        condition: service_healthy

  identitydb:
    image: postgres:16
    environment:
      - POSTGRES_USER=postgres
      - POSTGRES_PASSWORD=devpassword
      - POSTGRES_DB=identitydb
    ports:
      - "5435:5432"
    volumes:
      - identitydb-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
  rabbitmq:
    image: rabbitmq:3-management
    ports:
      - "5672:5672"
      - "15672:15672"
    environment:
      - RABBITMQ_DEFAULT_USER=guest
      - RABBITMQ_DEFAULT_PASS=guest
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
  apigateway:
    image: apigateway
    build:
      context: .
      dockerfile: src/ApiGateway/Dockerfile
    ports:
      - "6003:8080"
    environment:
      - ASPNETCORE_ENVIRONMENT=Docker
    depends_on:
      catalogserviceapi:
        condition: service_started
      orderingserviceapi:
        condition: service_started

volumes:
  catalogdb-data:
  orderingdb-data:
  billingdb-data:
  identitydb-data: